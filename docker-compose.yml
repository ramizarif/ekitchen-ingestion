services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - local.env
    environment:
      # Override for Docker networking
      - EKITCHEN_BASE_URL=http://host.docker.internal:8081
    volumes:
      # Mount code for development hot-reload
      - ./app:/app/app
      - ./parsers:/app/parsers
      - ./services:/app/services
      # Persist generated images
      - ./data/generated-recipe-images:/app/data/generated-recipe-images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
